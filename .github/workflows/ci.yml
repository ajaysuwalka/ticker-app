name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Select latest installed Xcode (needed for XCTest / swift test)
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcode-select -p

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test (with coverage)
        run: swift test --enable-code-coverage

      - name: Coverage summary
        run: |
          set -euo pipefail
          BIN="$(swift build --show-bin-path)"
          PROF="$BIN/codecov/default.profdata"
          XCTEST="$(find "$BIN" -type d -name '*.xctest' | head -1)"
          TESTBIN="$XCTEST/Contents/MacOS/$(basename "${XCTEST%.xctest}")"
          echo "profdata: $PROF"
          echo "test binary: $TESTBIN"
          xcrun llvm-cov report "$TESTBIN" -instr-profile "$PROF" \
            -ignore-filename-regex='(Tests|\.build)/' | tee coverage.txt
          xcrun llvm-cov export -format=lcov "$TESTBIN" -instr-profile "$PROF" \
            -ignore-filename-regex='(Tests|\.build)/' > coverage.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.lcov

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: false

      - name: Validate localizations
        run: ./tools/check-localizations.sh

      - name: SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then brew install swiftlint; fi
          swiftlint version
          swiftlint lint --reporter github-actions-logging

      - name: App bundle smoke test (build.sh)
        run: ./build.sh
