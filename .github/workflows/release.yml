name: Release

# Tag a version to publish a GitHub Release automatically:
#   git tag v1.0.0 && git push origin v1.0.0
#
# If the maintainer has configured the signing secrets (see docs/DISTRIBUTION.md),
# the app is signed with Developer ID, notarized by Apple, stapled, and shipped as
# a DMG. Without those secrets (e.g. on a fork), it falls back to an unsigned zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      CASK_PUSH_TOKEN: ${{ secrets.CASK_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode (needed for the universal --arch build)
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcode-select -p

      - name: Swift version
        run: swift --version

      - name: Sync app version to the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" Info.plist
          echo "Info.plist version set to $V"

      - name: "Build the app (universal: arm64 + x86_64)"
        run: UNIVERSAL=1 ./build.sh   # ad-hoc; re-signed with Developer ID below if configured

      # ---- Signed + notarized path (only when signing secrets are present) ----
      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          KC=build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          rm -f cert.p12

      - name: Sign, notarize & package DMG
        if: env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Ticker.app"
          codesign --force --deep --options runtime --timestamp --sign "$DEVELOPER_ID" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          STAGING="$(mktemp -d)"; cp -R "$APP" "$STAGING/"; ln -s /Applications "$STAGING/Applications"
          DMG="Ticker-${VERSION}.dmg"
          hdiutil create -volname "Ticker ${VERSION}" -srcfolder "$STAGING" -ov -format UDZO "$DMG"

          echo "$AC_API_KEY_P8" | base64 --decode > AuthKey.p8
          xcrun notarytool submit "$DMG" \
            --key AuthKey.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          rm -f AuthKey.p8
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t install "$DMG" || true
          # Stable-named copy so this URL always points to the newest build:
          #   github.com/ajaysuwalka/ticker-app/releases/latest/download/Ticker-macOS.dmg
          cp "$DMG" "Ticker-macOS.dmg"
          shasum -a 256 "$DMG" "Ticker-macOS.dmg" > checksums.txt

      # ---- Unsigned fallback (no secrets: forks, or before you enroll) ----
      - name: Package unsigned artifacts
        if: env.MACOS_CERT_P12 == ''
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent "build/Ticker.app" "Ticker-${VERSION}.zip"
          git archive --format=zip --prefix="ticker/" -o "Ticker-source-${VERSION}.zip" HEAD
          shasum -a 256 Ticker-*.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ### Install
            Download **`Ticker-${{ github.ref_name }}.dmg`**, open it, and drag Ticker to
            Applications. It's signed with Developer ID and notarized by Apple — no
            Gatekeeper wall.

            Building from source also works — see the README.

            `checksums.txt` has SHA-256 hashes for every asset.
          files: |
            Ticker-*.dmg
            Ticker-*.zip
            checksums.txt

      # Bump the Homebrew cask (version + sha256) and push it to main. Needs a
      # PAT because main is protected (the built-in GITHUB_TOKEN can't push to
      # it). Skipped when the signed DMG or the token is absent.
      - name: Update Homebrew cask
        if: env.MACOS_CERT_P12 != '' && env.CASK_PUSH_TOKEN != ''
        continue-on-error: true   # a cask hiccup must never fail the release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "Ticker-${VERSION}.dmg" | awk '{print $1}')"
          git fetch origin main --depth=1
          git checkout -B main origin/main
          sed -i '' -E "s/  version \"[^\"]+\"/  version \"${VERSION}\"/" Casks/ticker.rb
          sed -i '' -E "s/  sha256 \"[0-9a-f]+\"/  sha256 \"${SHA}\"/" Casks/ticker.rb
          git add Casks/ticker.rb
          if git diff --cached --quiet; then echo "cask already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cask: bump to ${VERSION} [skip ci]"
          git push "https://x-access-token:${CASK_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "Cask bumped to ${VERSION} (${SHA})"
