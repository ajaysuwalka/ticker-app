name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Ticker is local-only, so feel free to include details.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: "The Focus Goal ring shows..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard
        2. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.5 (Sonoma)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ticker version / commit
      placeholder: "v1.0.0 or commit sha"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console output, etc.
