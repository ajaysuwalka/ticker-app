# SwiftLint configuration for Ticker.
# Pragmatic defaults — keep signal high, avoid nagging on intentional style.

included:
  - Sources
  - Tests

excluded:
  - .build
  - build

disabled_rules:
  - todo                      # TODO/FIXME are fine in an evolving codebase
  - trailing_comma
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 700
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 140

identifier_name:
  min_length: 1              # short names like `s`, `f`, `c` are used deliberately
  max_length: 50
  excluded: [id, x, y, s, f, c, p, t, ok]

cyclomatic_complexity:
  warning: 15

nesting:
  type_level: 2
